name: Coverage Gate

on:
  pull_request:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run coverage check
        run: |
          PYTHONPATH=. pytest --cov=src --cov-report=term-missing --cov-report=term --cov-fail-under=85
          echo "## Coverage check" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage threshold enforced at 85% for the src folder." >> "$GITHUB_STEP_SUMMARY"
